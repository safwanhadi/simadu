{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Diterima | SIMADU</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-teal-50 to-cyan-50 p-4" style="font-family:'Plus Jakarta Sans',sans-serif">
    <main class="w-full max-w-lg rounded-3xl border border-teal-100 bg-white p-8 text-center shadow-2xl md:p-10">
        <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-amber-100 text-amber-600">
            <i class="ph ph-user-check text-4xl"></i>
        </div>
        <h1 class="mt-6 text-2xl font-extrabold text-gray-900">Registrasi berhasil dikirim</h1>
        <p class="mt-3 text-sm leading-6 text-gray-600">
            Akun Anda masih menunggu verifikasi Admin Akun RS Mandalika. Anda baru dapat masuk setelah akun diaktifkan oleh admin.
        </p>
        <div class="mt-5 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
            Hubungi Tim IT apabila akun belum diverifikasi atau terdapat kesalahan data.
        </div>
        <a href="{% url 'myaccount_urls:login_view' %}" class="mt-7 inline-flex items-center gap-2 rounded-full bg-teal-700 px-7 py-3 text-sm font-bold text-white hover:bg-teal-800">
            <i class="ph ph-arrow-left"></i> Kembali ke halaman login
        </a>
    </main>
</body>
</html>
