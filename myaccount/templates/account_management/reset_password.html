{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card card-solid">
            <div class="card-header"><h3 class="card-title">{{ card_title }}</h3></div>
            <form method="post">
                {% csrf_token %}
                <div class="card-body">
                    <p>Atur kata sandi baru untuk <strong>{{ target.full_name }}</strong> ({{ target.email }}).</p>
                    {{ form|crispy }}
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <a href="{% url 'myaccount_urls:account_management_list' %}" class="btn btn-secondary">Kembali</a>
                    <button type="submit" class="btn btn-warning"><i class="fas fa-key"></i> Reset Kata Sandi</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
