{% if riwayat == 'active' and selected != 'riwayat' and not document_admin %}
<div class="card card-outline card-secondary mb-3">
    <div class="card-header py-2 d-flex justify-content-between align-items-center">
        <h3 class="card-title">
            <i class="fas fa-folder-open mr-1"></i> Akses Cepat Dokumen SDM
        </h3>
        {% if document_export_url %}
        <a href="{{ document_export_url }}" class="btn btn-sm btn-success ml-auto">
            <i class="fas fa-file-csv mr-1"></i> Export Semua CSV
        </a>
        {% endif %}
    </div>
    <div class="card-body d-flex flex-wrap py-2" style="gap: .4rem;">
        {% for label, url_name, selected_key in document_quick_links %}
        <a href="{% url url_name %}{% if request.user.is_dokumen_admin and document_admin_employee %}?nip={{ document_admin_employee.profil_user.nip|urlencode }}{% endif %}"
           class="btn btn-sm {% if selected == selected_key %}btn-primary{% else %}btn-outline-secondary{% endif %}">
            {{ label }}
        </a>
        {% endfor %}
    </div>
</div>
{% endif %}
