{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card card-solid">
    <div class="card-header"><h5 class="mb-0">{{ card_title }}</h5></div>
    <form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="card-body">{{ form|crispy }}</div>
        <div class="card-footer d-flex justify-content-between"><a href="{{ document_menu_url }}" class="btn btn-secondary">Kembali ke Menu Riwayat</a><button type="submit" class="btn btn-success">Simpan</button></div>
    </form>
</div></div></div>
{% endblock %}
{% block script %}<script>$(function () {$('.select2').select2({theme:'bootstrap4',width:'100%',placeholder:'Pilih data',allowClear:true});});</script>{% endblock script %}
